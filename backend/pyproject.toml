[project]
name = "costpilot-backend"
version = "0.1.0"
description = "CostPilot - Cloud Cost Optimization Platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "motor>=3.6.0",
    "pymongo>=4.10.0",
    "redis>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "cryptography>=44.0.0",
    "azure-mgmt-advisor>=9.0.0",
    "azure-identity>=1.19.0,<2.0.0",
    "azure-core>=1.30.0,<1.32.0",
    "azure-mgmt-core>=1.4.0,<1.6.0",
    "azure-mgmt-costmanagement>=3.0.0,<4.0.0",
    "azure-mgmt-resource>=23.0.0,<24.0.0",
    "azure-mgmt-compute>=33.0.0,<34.0.0",
    "azure-mgmt-storage>=21.0.0,<22.0.0",
    "azure-mgmt-sql>=3.0.0,<4.0.0",
    "google-cloud-recommender>=2.15.0",
    "google-cloud-compute>=1.19.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-resource-manager>=1.17.0",
    "google-cloud-bigquery>=3.14.0",
    "google-auth>=2.25.0",
    "google-api-python-client>=2.100.0",
    "aiosmtplib>=3.0.0",
    "apscheduler>=3.10.0",
    "pandas>=2.2.0",
    "prometheus-client>=0.20.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
